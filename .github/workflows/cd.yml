name: TicketHub CD

on:
  workflow_run:
    workflows:
      - TicketHub CI
    types:
      - completed

jobs:
  deploy:

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

    steps:

      # =====================================================
      # Checkout Repository
      # =====================================================

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # =====================================================
      # Azure Login
      # =====================================================

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # =====================================================
      # Login to Azure Container Registry
      # =====================================================

      - name: Login to Azure Container Registry
        run: az acr login --name ${{ secrets.ACR_NAME }}

      # =====================================================
      # Setup Docker Buildx
      # =====================================================

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # =====================================================
      # Build Backend Image
      # =====================================================

      - name: Build Backend Image
        run: |
          docker build \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/tickethub-backend:${IMAGE_TAG} \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/tickethub-backend:latest \
            ./server

      # =====================================================
      # Build Frontend Image
      # =====================================================

      - name: Build Frontend Image
        run: |
          docker build \
            --build-arg VITE_API_URL=/api/v1 \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/tickethub-frontend:${IMAGE_TAG} \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/tickethub-frontend:latest \
            ./client

      # =====================================================
      # Push Backend Images
      # =====================================================

      - name: Push Backend Images
        run: |
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/tickethub-backend:${IMAGE_TAG}
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/tickethub-backend:latest

      # =====================================================
      # Push Frontend Images
      # =====================================================

      - name: Push Frontend Images
        run: |
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/tickethub-frontend:${IMAGE_TAG}
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/tickethub-frontend:latest

      # =====================================================
      # Update Helm values.yaml
      # =====================================================

      - name: Update Backend Image Tag
        uses: mikefarah/yq@v4
        with:
          cmd: >
            yq -i '.backend.image.tag = strenv(IMAGE_TAG)'
            helm/tickethub/values.yaml

      - name: Update Frontend Image Tag
        uses: mikefarah/yq@v4
        with:
          cmd: >
            yq -i '.frontend.image.tag = strenv(IMAGE_TAG)'
            helm/tickethub/values.yaml

      # =====================================================
      # Commit Changes
      # =====================================================

      - name: Commit Updated Helm Values
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/tickethub/values.yaml

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "chore: update image tags to ${IMAGE_TAG}"

      # =====================================================
      # Push Changes
      # =====================================================

      - name: Push Changes
        run: |
          git push origin main