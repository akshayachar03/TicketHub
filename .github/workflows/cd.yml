name: TicketHub CD

on:
  workflow_run:
    workflows:
      - TicketHub CI
    types:
      - completed

jobs:
  deploy:

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

    steps:

      # =====================================================
      # Checkout
      # =====================================================

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # =====================================================
      # Azure Login
      # =====================================================

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # =====================================================
      # Login to ACR
      # =====================================================

      - name: Login to Azure Container Registry
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      # =====================================================
      # Docker Buildx
      # =====================================================

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # =====================================================
      # Build Backend
      # =====================================================

      - name: Build Backend Image
        run: |
          docker build \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/tickethub-backend:${IMAGE_TAG} \
            ./server

      # =====================================================
      # Build Frontend
      # =====================================================

      - name: Build Frontend Image
        run: |
          docker build \
            --build-arg VITE_API_URL=/api/v1 \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/tickethub-frontend:${IMAGE_TAG} \
            ./client

      # =====================================================
      # Push Images
      # =====================================================

      - name: Push Backend Image
        run: |
          docker push \
            ${{ secrets.ACR_NAME }}.azurecr.io/tickethub-backend:${IMAGE_TAG}

      - name: Push Frontend Image
        run: |
          docker push \
            ${{ secrets.ACR_NAME }}.azurecr.io/tickethub-frontend:${IMAGE_TAG}

      # =====================================================
      # Configure AKS
      # =====================================================

      - name: Set AKS Context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      # =====================================================
      # Deploy Backend
      # =====================================================

      - name: Update Backend Deployment
        run: |
          kubectl set image deployment/tickethub-backend \
            backend=${{ secrets.ACR_NAME }}.azurecr.io/tickethub-backend:${IMAGE_TAG} \
            -n tickethub

      # =====================================================
      # Deploy Frontend
      # =====================================================

      - name: Update Frontend Deployment
        run: |
          kubectl set image deployment/tickethub-frontend \
            frontend=${{ secrets.ACR_NAME }}.azurecr.io/tickethub-frontend:${IMAGE_TAG} \
            -n tickethub

      # =====================================================
      # Verify Rollout
      # =====================================================

      - name: Verify Backend Rollout
        run: |
          kubectl rollout status deployment/tickethub-backend -n tickethub

      - name: Verify Frontend Rollout
        run: |
          kubectl rollout status deployment/tickethub-frontend -n tickethub

      # =====================================================
      # Show Running Images
      # =====================================================

      - name: Show Running Images
        run: |
          kubectl get deployment tickethub-backend -n tickethub -o wide
          kubectl get deployment tickethub-frontend -n tickethub -o wide