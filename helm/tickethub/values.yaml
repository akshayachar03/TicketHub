namespace: tickethub

backend:
  replicaCount: 2

  image:
    repository: tickethubacr2026.azurecr.io/tickethub-backend
    tag: latest
    pullPolicy: Always

  service:
    type: ClusterIP
    port: 5000

  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"

    limits:
      cpu: "500m"
      memory: "512Mi"

  probes:
    liveness:
      path: /health
      initialDelaySeconds: 20
      periodSeconds: 10

    readiness:
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 5

frontend:
  replicaCount: 2

  image:
    repository: tickethubacr2026.azurecr.io/tickethub-frontend
    tag: latest
    pullPolicy: Always

  service:
    type: ClusterIP
    port: 80

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"

    limits:
      cpu: "250m"
      memory: "256Mi"

  probes:
    liveness:
      path: /
      initialDelaySeconds: 15
      periodSeconds: 10

    readiness:
      path: /
      initialDelaySeconds: 10
      periodSeconds: 5

config:
  NODE_ENV: production
  PORT: "5000"

secret:
  JWT_SECRET: "change-me"
  MONGODB_URI: "change-me"