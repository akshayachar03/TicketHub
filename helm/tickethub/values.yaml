namespace: tickethub
backend:
  replicaCount: 1
  image:
    repository: tickethubacr2026.azurecr.io/tickethub-backend
    tag: ba40378b5398baaa3e432df584e24b61cb759b01
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 5000
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"
  probes:
    liveness:
      path: /health
      initialDelaySeconds: 20
      periodSeconds: 10
    readiness:
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 5
frontend:
  replicaCount: 1
  image:
    repository: tickethubacr2026.azurecr.io/tickethub-frontend
    tag: ba40378b5398baaa3e432df584e24b61cb759b01
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "150m"
      memory: "128Mi"
  probes:
    liveness:
      path: /
      initialDelaySeconds: 15
      periodSeconds: 10
    readiness:
      path: /
      initialDelaySeconds: 10
      periodSeconds: 5
config:
  NODE_ENV: production
  PORT: "5000"
