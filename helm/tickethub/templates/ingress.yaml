apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: tickethub-ingress
  namespace: {{ .Values.namespace }}

spec:
  ingressClassName: nginx

  rules:
    - http:
        paths:

          - path: /
            pathType: Prefix
            backend:
              service:
                name: tickethub-frontend-service
                port:
                  number: 80

          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: tickethub-backend-service
                port:
                  number: 5000